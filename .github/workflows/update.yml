name: Update public GIS Torgi feed

on:
  push:
    branches: [main]
    paths:
      - bridge.py
      - scripts/**
      - tests/**
      - .github/workflows/update.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gis-torgi-feed
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test bridge
        run: python -m unittest discover -s tests -v

  fetch:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: [self-hosted, macOS, ARM64, gis-torgi-ru]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .source-cache
          key: gis-property-v1-${{ github.run_id }}
          restore-keys: gis-property-v1-
      - name: Download and normalize official OpenData
        run: python3 -u bridge.py --days 7 --max-details 1200 --workers 8 --cache-dir .source-cache --output out/feed-v1.json --status out/status.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .source-cache
          key: gis-property-v1-${{ github.run_id }}
      - name: Upload candidate feed
        uses: actions/upload-artifact@v4
        with:
          name: gis-torgi-candidate
          path: out
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: gis-torgi-candidate
          path: incoming
      - name: Validate isolated candidate
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          import bridge

          feed = json.loads(Path("incoming/feed-v1.json").read_text(encoding="utf-8"))
          status = json.loads(Path("incoming/status.json").read_text(encoding="utf-8"))
          bridge.validate_feed(feed)
          if not feed["lots"] or status.get("ok") is not True:
              raise SystemExit("candidate is empty or unsuccessful")
          Path("public").mkdir(exist_ok=True)
          shutil.copyfile("incoming/feed-v1.json", "public/feed-v1.json")
          shutil.copyfile("incoming/status.json", "public/status.json")
          PY
      - name: Publish changed feed
        run: |
          git add public/feed-v1.json public/status.json
          if git diff --cached --quiet; then
            echo "Feed is unchanged"
            exit 0
          fi
          git config user.name "reestrscan-open-data[bot]"
          git config user.email "reestrscan-open-data[bot]@users.noreply.github.com"
          git commit -m "data: refresh GIS Torgi feed"
          git push
